services:
  postgres:
    image: postgres:17-alpine
    container_name: leilao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leilao
      POSTGRES_PASSWORD: leilao
      POSTGRES_DB: leilao
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leilao -d leilao']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
