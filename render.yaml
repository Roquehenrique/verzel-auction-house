# Render Blueprint: creates the API web service from this repository.
# Dashboard -> New -> Blueprint -> pick the repository. Variables marked
# "sync: false" are asked for during the creation (see README, "Deploy").
services:
  - type: web
    name: casa-de-leiloes-api
    runtime: docker
    plan: free
    # Same region as the Neon database (AWS us-east-1) for low latency.
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # The free plan disk is erased on every deploy: secrets must come from
      # here, never be generated by the container (see docker-entrypoint.sh).
      - key: REQUIRE_SECRETS
        value: "true"
      # Neon connection string (direct connection, with sslmode=require).
      - key: DATABASE_URL
        sync: false
      # Front-end URL on Vercel (CORS), e.g. https://casa-de-leiloes.vercel.app
      - key: FRONTEND_URL
        sync: false
      # Generated locally with `npm run keys:generate` (Ed25519, base64).
      # Must never change after the first bid, or the audit flags every bid.
      - key: BID_SIGNING_PRIVATE_KEY
        sync: false
      # Random values generated by Render once and kept.
      - key: JWT_SECRET
        generateValue: true
      - key: PSEUDONYM_SECRET
        generateValue: true
